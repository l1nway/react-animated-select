name: Backend
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/react-animated-select/**'
      - 'README.md'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run build-data
      - run: echo "$GITHUB_SHA" > REVISION
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
        env:
          SSH_KEY: ${{secrets.OCI_SSH_KEY}}
          KNOWN_HOSTS: ${{secrets.OCI_KNOWN_HOSTS}}
      - name: Upload
        run: rsync -az --delete --exclude node_modules --exclude '.env*' --exclude .agents -e "ssh -i ~/.ssh/id_deploy" ./ "${{vars.OCI_USER}}@${{vars.OCI_HOST}}:rac/"
      - name: Restart
        run: ssh -i ~/.ssh/id_deploy "${{vars.OCI_USER}}@${{vars.OCI_HOST}}" 'cd rac && docker compose up -d --build --remove-orphans && docker image prune -f'
      - name: Check
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${{vars.OCI_DOMAIN}}/"
