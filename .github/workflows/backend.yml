name: Backend
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  id-token: write
concurrency:
  group: backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build-data
      - run: zip -r "$RUNNER_TEMP/backend.zip" . -x 'node_modules/*' '.env*'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}
      - run: |
          label="backend-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          aws s3 cp "$RUNNER_TEMP/backend.zip" "s3://${{vars.EB_BUCKET}}/$label.zip"
          aws elasticbeanstalk create-application-version --application-name "${{vars.EB_APP}}" --version-label "$label" --source-bundle "S3Bucket=${{vars.EB_BUCKET}},S3Key=$label.zip"
          aws elasticbeanstalk update-environment --environment-name "${{vars.EB_ENV}}" --version-label "$label"
          aws elasticbeanstalk wait environment-updated --environment-names "${{vars.EB_ENV}}"
