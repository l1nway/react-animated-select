name: Demo
on:
  push:
    branches: [main]
    paths:
      - 'packages/react-animated-select/**'
      - 'apps/demo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/react-animated-select
      - run: npm run build -w apps/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      deployments: write
    env:
      GH_TOKEN: ${{github.token}}
    steps:
      # keep only the newest github-pages deployment: mark the rest inactive, then delete them
      - run: |
          gh api --paginate "repos/${{github.repository}}/deployments?environment=github-pages&per_page=100" --jq '.[].id' | tail -n +2 | while read -r id; do
            gh api -X POST "repos/${{github.repository}}/deployments/$id/statuses" -f state=inactive > /dev/null
            gh api -X DELETE "repos/${{github.repository}}/deployments/$id"
          done
